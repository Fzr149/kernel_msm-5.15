name: Build Kernel 5.15

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel source repo URL (example: https://github.com/user/repo)"
        required: true
        default: https://github.com/Fzr149/kernel_msm-5.15
        type: string
      kernel_branch:
        description: "Branch"
        required: false
        default: google
        type: string
      defconfig:
        description: "Defconfig name (located in arch/arm64/configs/)"
        required: true
        default: "gki_defconfig"
        type: string
      localversion:
        description: "Kernel name suffix (CONFIG_LOCALVERSION), example: -oplus"
        required: false
        default: "-oplus"
        type: string
      hz:
        description: "Tick rate (CONFIG_HZ)"
        required: true
        default: "300"
        type: choice
        options:
          - "100"
          - "250"
          - "300"
          - "1000"
      anykernel_repo:
        description: "(Optional) AnyKernel3 template repo URL to build a flashable zip. Empty = Image only"
        required: false
        type: string
      anykernel_branch:
        description: "AnyKernel3 branch (leave empty = default branch)"
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    defaults:
      run:
        shell: bash

    env:
      ARCH: arm64
      LLVM: "1"
      LLVM_IAS: "1"
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_COMPAT: arm-linux-gnueabi-
      KBUILD_BUILD_USER: github
      KBUILD_BUILD_HOST: actions

    steps:
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential libssl-dev libelf-dev \
            cpio lz4 zstd xz-utils zip unzip git python3 dwarves \
            clang lld llvm \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          clang --version | head -n 1

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-5.15
          max-size: 3G

      - name: Setup SWAP 32GB
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 32

      - name: Tune Swap
        run: |
          echo "vm.swappiness=80" | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p

      - name: Clone kernel source
        env:
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
        run: |
          git clone --depth=1 ${KERNEL_BRANCH:+-b "$KERNEL_BRANCH"} "$KERNEL_REPO" kernel
          git -C kernel log -1 --oneline

      - name: Configure kernel
        working-directory: kernel
        env:
          DEFCONFIG: ${{ inputs.defconfig }}
          LOCALVERSION: ${{ inputs.localversion }}
          HZ: ${{ inputs.hz }}
        run: |
          make O=out "$DEFCONFIG"

          # pilihan dalam satu "choice" harus dimatiin semua dulu, baru nyalain yang dipilih
          for h in 100 250 300 1000; do
            scripts/config --file out/.config -d "HZ_$h"
          done

          scripts/config --file out/.config \
            -d LTO_NONE -d LTO_CLANG_FULL -e LTO_CLANG_THIN \
            -d CC_OPTIMIZE_FOR_PERFORMANCE -d CC_OPTIMIZE_FOR_SIZE \
            -e CC_OPTIMIZE_FOR_PERFORMANCE_O3 \
            -e WQ_POWER_EFFICIENT_DEFAULT \
            -e "HZ_$HZ" \
            -d LOCALVERSION_AUTO \
            --set-str LOCALVERSION "$LOCALVERSION"

          make O=out olddefconfig

          # cek semua opsi beneran kepasang, kalau nggak langsung gagal (sebelum build lama)
          for c in \
            "CONFIG_LTO_CLANG_THIN=y" \
            "CONFIG_WQ_POWER_EFFICIENT_DEFAULT=y" \
            "CONFIG_HZ_$HZ=y" \
            "CONFIG_HZ=$HZ" \
            "CONFIG_LOCALVERSION=\"$LOCALVERSION\""; do
            grep -Fqx "$c" out/.config || { echo "::error::Gagal kepasang: $c"; exit 1; }
          done

          # O3: kalau symbol-nya nggak ada di source, pakai -O3 lewat KCFLAGS sebagai gantinya
          if grep -qx "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3=y" out/.config; then
            echo "KCFLAGS=-Wno-error" >> "$GITHUB_ENV"
          else
            echo "::warning::Symbol O3 nggak ada di source ini, -O3 dipasang lewat KCFLAGS"
            echo "KCFLAGS=-O3 -Wno-error" >> "$GITHUB_ENV"
          fi

          make O=out -s kernelrelease

      - name: Build
        working-directory: kernel
        run: |
          make -j"$(nproc)" O=out CC="ccache clang" Image 2>&1 | tee ../build.log
          ccache -s

      - name: Check output
        run: |
          ls -lh kernel/out/arch/arm64/boot/Image
          mkdir result
          cp kernel/out/arch/arm64/boot/Image result/

      - name: Package AnyKernel3 zip
        if: ${{ inputs.anykernel_repo != '' }}
        env:
          AK_REPO: ${{ inputs.anykernel_repo }}
          AK_BRANCH: ${{ inputs.anykernel_branch }}
        run: |
          git clone --depth=1 ${AK_BRANCH:+-b "$AK_BRANCH"} "$AK_REPO" ak3
          cp kernel/out/arch/arm64/boot/Image ak3/Image
          cd ak3
          zip -r9 "$GITHUB_WORKSPACE/result/Kernel-AK3.zip" . -x ".git*"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: kernel-result
          path: result/*

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
